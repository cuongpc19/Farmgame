<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
// Stage 3+ machines next to the stage 1-2 ones. ?view=game (57° like the game) | side | top.
// ?tool=1 poses each machine's tool mid-hit. Prints triangle counts to window.__tris.
import * as THREE from "three";
import { loadProps } from "/src/game/props3d.ts";
import { makeVehicleModel } from "/src/game/models.ts";
const q = new URLSearchParams(location.search); const view = q.get("view") ?? "game";
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0xa08a70);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
if (view === "side") { cam.position.set(30, 3, 0); cam.lookAt(0, 1.6, 0); }
else if (view === "top") { cam.position.set(0, 60, 4.01); cam.lookAt(0, 0, 4); }
else { cam.position.set(0, 46, 35); cam.lookAt(0, 0, 4); }
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.25)); const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(10, 20, 12); s.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0xa08a70 })); ground.rotation.x = -Math.PI / 2; s.add(ground);
window.__game = { ready: true }; window.__dbg = "loading";
try {
  await loadProps();
  const old = ["hydraulicBreaker", "rollerCrusher", "dumpTruck", "wheelLoader", "allTerrainVehicle", "wheelbarrow"];
  const neu = ["drillCrusher", "crushHammer", "infernoBreaker", "haulTruck", "wheelCrusher", "fuelTruck"];
  const tris = {};
  const place = (keys, z) => keys.forEach((k, i) => {
    const m = makeVehicleModel(k); m.root.scale.setScalar(k === "wheelbarrow" ? 1.4 : 1.5);
    if (view === "side") { m.root.position.set(0, 0, (i - 2.5) * 7.5); m.root.rotation.y = 0; }
    else { m.root.position.set((i - 2.5) * 7.5, 0, z); m.root.rotation.y = view === "top" ? Math.PI : 0.5; }
    if (q.get("tool") && m.tool && k === "crushHammer") m.tool.rotation.x = -0.45;
    s.add(m.root);
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({ color: 0xff3366 })); m.stackAnchor.add(st);
    let n = 0, c = 0; m.root.traverse((o) => { if (o.isMesh && o !== st) { c++; const g = o.geometry; n += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
    tris[k] = Math.round(n) + " tris / " + c + " meshes";
  });
  if (view !== "side") place(old, -4);
  place(neu, view === "side" ? 0 : 9);
  window.__tris = tris;
  r.render(s, cam); window.__dbg = "ok";
} catch (e) { window.__dbg = "ERR " + (e.stack || e); }
</script></body></html>
