<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
import * as THREE from "three";
import { loadCharacters, Character } from "/src/game/characters.ts";
import { Stack } from "/src/game/world/Stack.ts";
const q = new URLSearchParams(location.search); const view = q.get("view") ?? "front";
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8a7a68);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
if (view === "side") cam.position.set(46, 6, 0); else if (view === "game") cam.position.set(0, 26, 17); else cam.position.set(0, 4, 30);
cam.lookAt(0, 1.2, 0);
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.25));
const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(4, 8, 6); s.add(d);
window.__game = { ready: true }; window.__dbg = "loading";
try {
await loadCharacters();
// row 0: swing phases (player); row 1: poses / workers
const shots = [
  ["player", 0, "idle", 0], ["player", 0, "idle", 0.1], ["player", 0, "idle", 0.2], ["player", 0, "idle", 0.25], ["player", 0, "idle", 0.29], ["player", 0, "idle", 0.36], ["player", 0, "idle", 0.45],
  ["player", 0, "run", -1], ["worker", 11, "walk", -1], ["worker", 22, "idle", -1], ["worker", 33, "sit", -1], ["worker", 44, "idle", -2], ["worker", 55, "idle", -1], ["worker", 66, "idle", -1],
];
shots.forEach(([k, seed, pose, st], i) => {
  const c = new Character(k, seed, { tool: k === "player" || seed % 2 === 0 });
  const row = i < 7 ? 0 : 1, col = i % 7;
  if (view === "side") { c.root.position.set(0, row ? 0 : 3.6, -(col - 3) * 3.4); c.root.rotation.y = 0; }
  else c.root.position.set((col - 3) * 2.4, 0, row ? 2 : -2);
  if (view === "front") c.root.rotation.y = 0;
  if (view === "game") c.root.rotation.y = col * Math.PI / 4;
  c.pose = pose; c.hold = st === -2;
  s.add(c.root);
  const st2 = new Stack(c.stackAnchor, 5, () => 0xc8633a, { cols: 2, rows: 1, size: 0.36 }); for (let j = 0; j < 5; j++) st2.push(10001);
  for (let t = 0; t < 30; t++) c.update(1 / 30);
  if (st >= 0) { c.windup(0.29); const n = Math.round(st * 60); for (let t = 0; t < n; t++) c.update(1 / 60); if (n === 0) c.update(0.0001); }
});
r.render(s, cam); window.__dbg = "ok";
} catch (e) { window.__dbg = "ERR " + (e.stack || e); }
</script></body></html>
