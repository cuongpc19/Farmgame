<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
const q = new URLSearchParams(location.search); const file = q.get("file");
const cells = [[0,256],[64,256],[128,256],[192,256],[256,256],[320,256],[384,256],[448,256]];
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8a7a68);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200); cam.position.set(0, 10, 12); cam.lookAt(0, 0, 0);
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(4, 8, 6); s.add(d);
new GLTFLoader().load(file, (g) => {
  let map = null; g.scene.traverse(o => { if (o.isMesh && o.material.map) map = o.material.map; });
  const img = map.image;
  cells.forEach(([cx, cy], i) => {
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d"); x.drawImage(img, 0, 0);
    const u = img.width / 512; x.fillStyle = "#ff0000"; x.fillRect(cx * u, cy * u, 64 * u, 128 * u);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = map.flipY;
    const o = g.scene.clone(true); o.traverse(m => { if (m.isMesh) { m.material = m.material.clone(); m.material.map = t; } });
    const bb = new THREE.Box3().setFromObject(o); const sz = bb.getSize(new THREE.Vector3()); const k = 2 / Math.max(sz.x, sz.z); o.scale.setScalar(k);
    o.position.set((i % 4 - 1.5) * 2.6, 0, (Math.floor(i / 4) - 0.5) * 3); s.add(o);
  });
  r.render(s, cam); window.__game = { ready: true };
});
</script></body></html>
