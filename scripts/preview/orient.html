<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
const q = new URLSearchParams(location.search); const files = q.get("files").split(",");
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8a7a68);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 9, 7); cam.lookAt(0, 0, 0);
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(4, 8, 6); s.add(d);
let n = 0;
files.forEach((f, i) => new GLTFLoader().load(f, (g) => {
  const o = g.scene; const bb = new THREE.Box3().setFromObject(o); const sz = bb.getSize(new THREE.Vector3()); const k = 1.6 / Math.max(sz.x, sz.z);
  o.scale.setScalar(k); const grp = new THREE.Group(); grp.add(o); o.position.set(-(bb.min.x + bb.max.x) / 2 * k, -bb.min.y * k, -(bb.min.z + bb.max.z) / 2 * k);
  grp.position.x = (i - (files.length - 1) / 2) * 2.2; s.add(grp);
  const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 })); arrow.rotation.x = Math.PI / 2; arrow.position.set(grp.position.x, 0.05, 1.15); s.add(arrow);
  if (++n === files.length) { r.render(s, cam); window.__game = { ready: true }; }
}));
</script></body></html>
