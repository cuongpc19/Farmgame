<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
// Hand tools and back carriers on people. Row 0: each mining tool carried, then the three drills
// drilling. Row 1: the carriers from behind, empty and loaded. ?view=game (57°) | side | front | back.
import * as THREE from "three";
import { loadCharacters, Character, setToolHeat } from "/src/game/characters.ts";
import { Stack } from "/src/game/world/Stack.ts";
const q = new URLSearchParams(location.search); const view = q.get("view") ?? "game";
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8a7a68);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
const far = Number(q.get("far") ?? 22);
if (view === "side") cam.position.set(far, 3.4, 0); else if (view === "front") cam.position.set(0, 4, far); else if (view === "back") cam.position.set(0, 5, -far); else cam.position.set(0, far * 0.84, far * 0.55);
cam.lookAt(0, view === "side" ? 2.6 : 1.3, 0);
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.25));
const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(4, 8, 6); s.add(d);
window.__game = { ready: true }; window.__dbg = "loading";
try {
  await loadCharacters();
  // [mining, carrying, drilling?, heat, items on the back]
  const row0 = [["pickaxe", "woodenCarrier", 0, 0, 0], ["sledgehammer", "woodenCarrier", 0, 0, 0], ["jackhammer", "woodenCarrier", 0, 0, 0], ["largeHandDrill", "woodenCarrier", 0, 0, 0], ["knuckleDriller", "woodenCarrier", 0, 0, 0],
    ["jackhammer", "cargoPack", 1, 0, 0], ["largeHandDrill", "exoCarrier", 1, 0, 0], ["knuckleDriller", "exoCarrier", 1, 1, 0]];
  const row1 = [["pickaxe", "woodenCarrier", 0, 0, 0], ["pickaxe", "cargoPack", 0, 0, 0], ["pickaxe", "exoCarrier", 0, 0, 0], ["pickaxe", "woodenCarrier", 0, 0, 8], ["pickaxe", "cargoPack", 0, 0, 20], ["pickaxe", "exoCarrier", 0, 0, 40], ["knuckleDriller", "exoCarrier", 1, 0.5, 12], ["sledgehammer", "cargoPack", 0, 0, 0]];
  [row0, row1].forEach((row, ri) => row.forEach(([mine, carry, drill, heat, items], i) => {
    const c = new Character("player", 0);
    c.setGear(mine, carry);
    const x = (i - (row.length - 1) / 2) * 2.6;
    if (view === "side") { c.root.position.set(0, 0, -x); c.root.position.y = ri ? 0 : 3.6; c.root.rotation.y = 0; }
    else c.root.position.set(x, 0, ri ? 2.5 : -2.5);
    if (view === "back" || (view === "game" && ri === 1)) c.root.rotation.y = Math.PI;
    if (view === "game" && ri === 0) c.root.rotation.y = 0.6;
    s.add(c.root);
    const st = new Stack(c.stackAnchor, items || 1, () => 0xc8633a, { cols: 2, rows: 1, size: 0.36, maxShown: 40, outline: true, tallUpTo: 10 });
    for (let j = 0; j < items; j++) st.push(10001);
    for (let t = 0; t < 30; t++) c.update(1 / 30);
    if (heat) setToolHeat(c, heat);
    if (drill) { c.swing(); for (let t = 0; t < 6; t++) c.update(1 / 60); }
    c.root.updateMatrixWorld(true);
  }));
  r.render(s, cam); window.__dbg = "ok";
} catch (e) { window.__dbg = "ERR " + (e.stack || e); }
</script></body></html>
