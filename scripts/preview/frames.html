<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#8a7a68}</style></head>
<body><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { clone } from "three/examples/jsm/utils/SkeletonUtils.js";
const q = new URLSearchParams(location.search);
const file = q.get("file"), clips = q.get("clips").split(","), N = +(q.get("n") ?? 6);
const r = new THREE.WebGLRenderer({ antialias: true }); r.outputColorSpace = THREE.SRGBColorSpace;
r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8a7a68);
const cam = new THREE.OrthographicCamera(-N * 0.6, N * 0.6, clips.length * 0.75, -clips.length * 0.75, 0.1, 100);
const side = q.get("side") === "1";
cam.position.set(side ? 20 : 6, 8, side ? 0 : 20); cam.lookAt(0, 0, 0);
s.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5440, 1.4));
const d = new THREE.DirectionalLight(0xffffff, 1.9); d.position.set(4, 8, 6); s.add(d);
new GLTFLoader().load(file, (g) => {
  const bb = new THREE.Box3().setFromObject(g.scene); const h = bb.max.y - bb.min.y;
  clips.forEach((cn, row) => {
    const c = g.animations.find(a => a.name.endsWith(cn));
    for (let i = 0; i < N; i++) {
      const o = clone(g.scene); o.scale.setScalar(1.2 / h);
      const x = (i - (N - 1) / 2) * 1.15, y = (clips.length - 1) / 2 * 1.5 - row * 1.5 - 0.6;
      if (side) o.position.set(0, y, -x); else o.position.set(x, y, 0);
      s.add(o);
      if (c) { const mx = new THREE.AnimationMixer(o); const a = mx.clipAction(c); a.play(); mx.setTime(c.duration * i / N); }
    }
  });
  r.render(s, cam); window.__info = g.animations.map(a => a.name.split("|").pop() + ":" + a.duration.toFixed(2)).join(" "); window.__game = { ready: true };
});
</script></body></html>
